services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      - PORT=3001
      - DB_PATH=/app/data/pokaface.db
      - FRONTEND_ORIGIN=https://www.pokaface.win
      - ALLOWED_ORIGINS=https://pokaface.win,https://www.pokaface.win,http://158.101.1.222:3000,http://localhost:3000
      - BCRYPT_ROUNDS=10
      - ROOM_TTL_DAYS=7
      - NODE_ENV=production
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=https://api.pokaface.win
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
