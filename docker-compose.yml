services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - DB_PATH=/app/data/pokaface.db
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - BCRYPT_ROUNDS=10
      - ROOM_TTL_DAYS=7
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${BACKEND_URL:-http://localhost:3001}
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
